org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Also what lets Gradle run one project's tasks in parallel: `integrationTest` runs every
# version's at once. Build logic has to keep to its rules (no Project or Configuration
# captured by a task's actions; see SystemPropertyPath in build-logic).
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.js.yarn=false
