[versions]
kotlin = "2.4.20"
serialization = "1.11.0"
coroutines = "1.11.0"
# The oldest supported Minecraft's Paper API, which paper-common compiles against. Each
# adapter names its own Paper build in apps/plugin/paper-<minecraft>/build.gradle.kts.
paper-api = "1.21.11-R0.1-SNAPSHOT"
# The plugin APIs the Paper adapter wraps (nf.economy, nf.placeholders): compile-only, the server brings the plugins.
vault-api = "1.7.1"
placeholderapi = "2.11.6"
luajava = "4.1.0"
# The SQLite driver every supported Paper bundles: the runtime's store uses the server's copy, and the
# plugin's loader fetches this one only for a server without it.
sqlite-jdbc = "3.49.1.0"
cron-utils = "9.2.1"
okhttp = "5.5.0"
# `nf.wasm`: a pure-JVM WebAssembly runtime (its compiler turns a module into JVM bytecode; wabt is tests' wat2wasm).
chicory = "1.7.5"
# Remote databases (`nf.db("name")`): the connection pool and the PostgreSQL driver, which the plugin's loader fetches
# (Paper bundles MySQL's driver and SQLite's, not these); H2 stands in for either server in tests.
hikari = "7.1.0"
postgresql = "42.7.13"
h2 = "2.5.252"
# The debugger speaks DAP through lsp4j's protocol types and JSON-RPC endpoint.
lsp4j = "1.0.0"
# lsp4j reads and writes JSON with Gson, which is the server's own (the oldest supported Paper API
# carries this one): the runtime compiles and tests against it and never ships one.
gson = "2.11.0"
# The proxy plugin's API (apps/proxy/velocity): compile-only, the proxy brings it.
velocity-api = "4.3.0"
# The Velocity build the editor's dev networks run (Fill's build number for the version above):
# the proxy plugin names it in META-INF/netherforge/velocity.properties.
velocity-build = "44"
junit = "6.1.3"
shadow = "9.6.1"
run-paper = "3.1.0"
paperweight = "2.0.0-beta.24"
ktlint-gradle = "14.2.0"

[libraries]
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault-api" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
luajava = { module = "party.iroiro.luajava:luajava", version.ref = "luajava" }
luajava-lua54 = { module = "party.iroiro.luajava:lua54", version.ref = "luajava" }
luajava-natives = { module = "party.iroiro.luajava:lua54-platform", version.ref = "luajava" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
cron-utils = { module = "com.cronutils:cron-utils", version.ref = "cron-utils" }
# The cron library logs through SLF4J, which without a provider says so on stderr: the test runner has nothing to log to.
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.0.7" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
chicory-runtime = { module = "com.dylibso.chicory:runtime", version.ref = "chicory" }
chicory-wasi = { module = "com.dylibso.chicory:wasi", version.ref = "chicory" }
chicory-compiler = { module = "com.dylibso.chicory:compiler", version.ref = "chicory" }
chicory-wabt = { module = "com.dylibso.chicory:wabt", version.ref = "chicory" }
lsp4j-debug = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j.debug", version.ref = "lsp4j" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
