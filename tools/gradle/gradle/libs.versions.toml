[versions]
kotlin = "2.4.20"
serialization = "1.11.0"
coroutines = "1.11.0"
# The oldest supported Minecraft's Paper API, which paper-common compiles against. Each
# adapter names its own Paper build in apps/plugin/paper-<minecraft>/build.gradle.kts.
paper-api = "26.1.2.build.74-stable"
# The plugin APIs the Paper adapter wraps (nf.economy, nf.placeholders): compile-only, the server brings the plugins.
vault-api = "1.7.1"
placeholderapi = "2.11.6"
luajava = "4.1.0"
# The integration test reads the plugin's store (SQLite) itself.
sqlite-jdbc = "3.49.1.0"
# wabt (on Chicory, a pure-JVM WebAssembly runtime): the test fixtures' wat2wasm.
chicory = "1.7.5"
# The hub's store.
postgresql = "42.7.13"
# The proxy plugin's API (apps/proxy/velocity): compile-only, the proxy brings it.
velocity-api = "4.3.0"
# The Velocity build the editor's dev networks run (Fill's build number for the version above):
# the proxy plugin names it in META-INF/netherforge/velocity.properties.
velocity-build = "44"
junit = "6.1.3"
shadow = "9.6.1"
run-paper = "3.1.0"
paperweight = "2.0.0-beta.24"
ktlint-gradle = "14.2.0"

[libraries]
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault-api" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
luajava = { module = "party.iroiro.luajava:luajava", version.ref = "luajava" }
luajava-lua54 = { module = "party.iroiro.luajava:lua54", version.ref = "luajava" }
luajava-natives = { module = "party.iroiro.luajava:lua54-platform", version.ref = "luajava" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
chicory-wabt = { module = "com.dylibso.chicory:wabt", version.ref = "chicory" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
