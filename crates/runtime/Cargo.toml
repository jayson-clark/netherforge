[package]
name = "netherforge-runtime"
description = "NetherForge's runtime in Rust: scripts, scopes, events, timers and tasks"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
getrandom.workspace = true
indexmap.workspace = true
mlua.workspace = true
netherforge-luau = { path = "../luau" }
netherforge-api = { path = "../api" }
netherforge-format = { path = "../format" }
netherforge-platform = { path = "../platform" }
serde.workspace = true
serde_json.workspace = true
rapier3d-f64 = "0.36"
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
flate2 = "1"
crc32fast = "1"
fontdue = "0.9"
sha2.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
croner = "4.0.3"
# nf.http: the client (blocking, on the runtime's own threads), its TLS, WebSockets, and the web routes' requests.
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
httparse = "1"
url = "2"
encoding_rs = "0.8"
if-addrs = "0.15"
# nf.network: a connection's sealed lines (AES-256-GCM), as the hub seals them.
ring = "0.17"
# nf.wasm: compiled by Cranelift (or Pulley, its interpreter, with wasm.compile off); epochs stop calls on time.
wasmtime = { version = "41", default-features = false, features = ["runtime", "cranelift", "pulley", "std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
wat = "1"
