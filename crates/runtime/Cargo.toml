[package]
name = "netherforge-runtime"
description = "NetherForge's runtime in Rust: scripts, scopes, events, timers and tasks"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
getrandom.workspace = true
indexmap.workspace = true
mlua.workspace = true
netherforge-luau = { path = "../luau" }
netherforge-api = { path = "../api" }
netherforge-format = { path = "../format" }
netherforge-platform = { path = "../platform" }
serde.workspace = true
serde_json.workspace = true
rapier3d-f64 = "0.36"
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
flate2 = "1"
crc32fast = "1"
sha2.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
croner = "4.0.3"

[lints]
workspace = true
