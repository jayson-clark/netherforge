name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    name: Paper adapters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # One adapter per apps/plugin/paper-<minecraft> folder, as Gradle includes them: every one on
      # Linux, the newest (the last in version order) on macOS and Windows.
      - name: List them
        id: list
        run: |
          versions=$(find apps/plugin -mindepth 1 -maxdepth 1 -type d -name 'paper-*' -printf '%f\n' \
            | sed -n 's/^paper-\([0-9][0-9.]*\)$/\1/p' | sort -V | jq -R . | jq -sc .)
          matrix=$(jq -c '[.[] | {os: "ubuntu-latest", minecraft: .}]
            + [{os: "macos-latest", minecraft: last}, {os: "windows-latest", minecraft: last}]' <<< "$versions")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  integration:
    name: integration (Paper ${{ matrix.minecraft }}, ${{ matrix.os }})
    needs: adapters
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.adapters.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
      - name: The pinned Paper build
        id: paper
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: echo "pin=$(grep -E '^\s*(paper|serverBuild) =' "apps/plugin/paper-$MINECRAFT/build.gradle.kts" | tr -d ' "' | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the Paper and Mojang server jars
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches/netherforge/paper/paper-${{ matrix.minecraft }}-*.jar
            apps/plugin/integration/build/integration/${{ matrix.minecraft }}/server/cache
            apps/plugin/integration/build/integration/${{ matrix.minecraft }}/server/libraries
            apps/plugin/integration/build/integration/${{ matrix.minecraft }}/server/versions
          key: paper-jars-${{ runner.os }}-${{ matrix.minecraft }}-${{ steps.paper.outputs.pin }}
      - name: Every scenario against this version's adapter
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: node tools/gradle.mjs ":plugin:integration:integrationTest-$MINECRAFT" -Pnetherforge.integration.scope=full
      - name: Test counts
        if: success() || failure()
        uses: ./.github/actions/junit-summary
        with:
          title: Integration, Paper ${{ matrix.minecraft }} on ${{ runner.os }}
          path: apps/plugin/integration/build/test-results/integration/${{ matrix.minecraft }}
      - name: Keep the server logs and reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.minecraft }}-${{ runner.os }}
          path: |
            apps/plugin/integration/build/integration/${{ matrix.minecraft }}/server/*.log
            apps/plugin/integration/build/integration/${{ matrix.minecraft }}/server/logs/
            apps/plugin/integration/build/test-results/integration/${{ matrix.minecraft }}/
            apps/plugin/integration/build/reports/integration/${{ matrix.minecraft }}/
          retention-days: 14
      # The quarantined tests on their own, after the rest (their results replace the reports above):
      # they never fail the night, and a pass here says a fix worked and the tag can come off.
      - name: Quarantined tests (not blocking)
        if: (success() || failure()) && runner.os == 'Linux'
        continue-on-error: true
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: node tools/gradle.mjs ":plugin:integration:integrationTest-$MINECRAFT" -Pnetherforge.integration.scope=quarantine
      - name: Quarantined test counts
        if: (success() || failure()) && runner.os == 'Linux'
        uses: ./.github/actions/junit-summary
        with:
          title: Quarantined, Paper ${{ matrix.minecraft }}
          path: apps/plugin/integration/build/test-results/integration/${{ matrix.minecraft }}

  editor:
    name: e2e + bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter @netherforge/editor exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep Playwright's results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ runner.os }}
          path: |
            apps/editor/test-results/
            apps/editor/playwright-report/
          retention-days: 14
      - run: pnpm --filter @netherforge/editor bundle
      - name: Packaged-app smoke test
        if: runner.os != 'macOS'
        run: pnpm --filter @netherforge/editor test:smoke

  report:
    needs: [integration, editor]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly failed: ${new Date().toISOString().slice(0, 10)}`,
              body: `See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['nightly'],
            })
