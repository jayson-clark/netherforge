# The Rust runtime's crates (see the rust-runtime skill). The editor's backend
# (apps/editor/src-tauri) is its own workspace for now.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
mlua = { version = "0.12", features = ["luau"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
