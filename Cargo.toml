# The Rust runtime's crates (see the rust-runtime skill). The editor's backend
# (apps/editor/src-tauri) is its own workspace for now.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["apps/editor/src-tauri"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
mlua = { version = "0.12", features = ["luau"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
regex = "1"
schemars = "1"
sha2 = "0.10"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
